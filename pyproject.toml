[project]
name = "animal-spirits-brand"
version = "1.0.0"
description = "Animal Spirits' logos, colour tokens and themes, generated from code."
requires-python = ">=3.13"
dependencies = ["fonttools[woff]>=4.50", "numpy>=2", "pillow>=10", "potracer>=0.0.4", "scipy>=1.13"]

[project.optional-dependencies]
png = ["playwright>=1.40"]

[project.scripts]
animal-spirits-brand = "animal_spirits_brand.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animal_spirits_brand"]
